# Bot de Telegram de Conexión Endzone.
# Cada ejecución escucha Telegram 55 minutos y al acabar lanza la siguiente
# (relevo); el cron es el respaldo. Así responde en segundos. Los lunes a las 10:00 (Madrid) manda los
# carruseles de la semana; los martes reintenta los que tenían actas incompletas.
name: bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # para lanzar el relevo

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: ¿Está el token de Telegram?
        id: token
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Falta el secreto TELEGRAM_TOKEN: no hago nada"; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.token.outputs.ok == 'true'
        with:
          enable-cache: true

      - run: uv sync --frozen
        if: steps.token.outputs.ok == 'true'

      - name: Caché de iSquad (actas y escudos)
        if: steps.token.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/isquad
          key: isquad-${{ github.run_id }}
          restore-keys: isquad-

      - name: Navegador (usa el Chrome del runner; si no hay, instala Chromium)
        if: steps.token.outputs.ok == 'true'
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            uv run playwright install --with-deps chromium
          fi

      - name: Escuchar Telegram
        if: steps.token.outputs.ok == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: uv run python -m rugbyig bot --minutos 55

      - name: Guardar estado
        if: always() && steps.token.outputs.ok == 'true'
        run: |
          git config user.name "conexion-endzone-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p estado data
          git add estado data
          git diff --cached --quiet && exit 0
          git commit -m "Estado del bot"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - name: Relevo (lanza la siguiente ejecución; el cron queda de respaldo)
        if: always() && steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
